openapi: "3.0.3"
info:
  title: Character Gallery API
  description: |
    A RESTful API built in Go to create, manage and see a gallery of Role
    Playing Game characters. Supports full CRUD operations, including base
    stats and character appearance customization, plus a turn-based tactical
    RPG combat system.
  version: "1.0.0"

servers:
  - url: /api/v1
    description: Current server (adapts automatically to localhost or Cloudflare)

# All endpoints require a valid JWT by default. Public endpoints
# (register, login, metrics, docs) override this with `security: []`.
security:
  - bearerAuth: []

paths:
  # ─── Authentication ────────────────────────────────────────────────

  /auth/register:
    post:
      security: []
      operationId: register
      summary: Register a new user
      description: Creates a new user account with a hashed password.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      security: []
      operationId: login
      summary: Login
      description: Authenticates a user and returns a JWT token (24h expiry).
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Characters ────────────────────────────────────────────────────

  /characters:
    post:
      operationId: createCharacter
      summary: Create a character
      description: Creates a new character with stats and customization.
      tags: [Characters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterRequest"
      responses:
        "201":
          description: Character created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Maximum of 6 characters per user reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: getAllCharacters
      summary: Get all characters
      description: |
        Returns a paginated list of the authenticated user's characters,
        including stats, customization, and RPG fields.
      tags: [Characters]
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 20
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated list of characters
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Character"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /characters/{characterId}:
    get:
      operationId: getCharacter
      summary: Get a character by ID
      description: Returns a single character by their ID.
      tags: [Characters]
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Character object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: updateCharacter
      summary: Update a character
      description: |
        Updates an existing character by their ID. Only the owning user may
        update; an `admin` may update any character.
      tags: [Characters]
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterRequest"
      responses:
        "200":
          description: Character updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteCharacter
      summary: Delete a character
      description: |
        Deletes an existing character by their ID. Only the owning user may
        delete; an `admin` may delete any character.
      tags: [Characters]
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Character deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /characters/{characterId}/equip/{itemId}:
    put:
      operationId: equipItem
      summary: Equip or unequip an item
      description: |
        Equips or unequips an item on a character (owner or admin only).
        Automatically unequips other items of the same type and recalculates AC.
      tags: [Characters]
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipRequest"
      responses:
        "200":
          description: Item equipped/unequipped successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /characters/{characterId}/use/{itemId}:
    post:
      operationId: useItem
      summary: Use a healing consumable item
      description: |
        Consumes 1 unit of a healing item from the character's inventory and
        restores `hp_current` up to `hp_max` (owner or admin only).
      tags: [Characters]
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Updated character after healing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /characters/{characterId}/prestige:
    post:
      operationId: prestigeCharacter
      summary: Prestige a level 10 character
      description: |
        Resets a level 10 character back to level 1 (Tier 1), increments
        `prestige` by +1, recalculates starting HP, and permanently increases
        all base stats by +1 (capped at 99). Owner or admin only.
      tags: [Characters]
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Prestiged character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Inventory ────────────────────────────────────────────────────

  /characters/{characterId}/inventory:
    get:
      operationId: getCharacterInventory
      summary: Get a character's inventory
      description: Returns all items in a character's inventory.
      tags: [Inventory]
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Array of inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /characters/{characterId}/inventory/{itemId}:
    post:
      operationId: addItemToCharacter
      summary: Add item to character inventory
      description: Adds a specific item to the character's inventory.
      tags: [Inventory]
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: quantity
          in: query
          description: Amount of items to add (defaults to 1)
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Item added to inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: removeItemFromCharacter
      summary: Remove item from character inventory
      description: Removes a specific item from the character's inventory.
      tags: [Inventory]
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: quantity
          in: query
          description: Amount of items to remove (defaults to 1)
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Item removed from inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Items ─────────────────────────────────────────────────────────

  /items:
    post:
      operationId: createItem
      summary: Create an item
      description: |
        Creates a new item and adds it to the item pool. **Admin only**;
        requires a JWT with role `admin`.
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: getItemPool
      summary: Get the item pool
      description: Returns a paginated list of all items in the item pool.
      tags: [Items]
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page (minimum 20)
          schema:
            type: integer
            minimum: 20
            default: 20
      responses:
        "200":
          description: Paginated list of items
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "500":
          $ref: "#/components/responses/InternalError"

  /items/{itemId}:
    get:
      operationId: getItem
      summary: Get an item by ID
      description: Returns a single item from the item pool.
      tags: [Items]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Item object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Dice Rolling ──────────────────────────────────────────────────

  /roll:
    post:
      operationId: rollDice
      summary: Roll dice
      description: |
        Server-authoritative dice roll. The server is the source of truth—
        the client never rolls dice locally.
      tags: [Combat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollRequest"
      responses:
        "200":
          description: Dice roll result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Game Sessions ─────────────────────────────────────────────────

  /sessions:
    post:
      operationId: createSession
      summary: Create a game session
      description: Creates a new game session with selected characters.
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listSessions
      summary: List game sessions
      description: Returns all game sessions for the authenticated user.
      tags: [Sessions]
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionListItem"
        "500":
          $ref: "#/components/responses/InternalError"

  /sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get session details
      description: Returns a game session with its participants.
      tags: [Sessions]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Session object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: updateSession
      summary: Update a game session
      description: Updates session name or character list.
      tags: [Sessions]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteSession
      summary: Delete a game session
      description: Deletes a session and all associated encounters.
      tags: [Sessions]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Encounters ────────────────────────────────────────────────────

  /sessions/{sessionId}/encounters:
    post:
      operationId: createEncounter
      summary: Create an encounter
      description: Adds enemies to a session for combat.
      tags: [Encounters]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEncounterRequest"
      responses:
        "201":
          description: Encounter created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listEncounters
      summary: List encounters
      description: Returns all encounters for a session.
      tags: [Encounters]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: List of encounters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EncounterSummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /sessions/{sessionId}/encounters/{encounterId}/start:
    post:
      operationId: startEncounter
      summary: Start an encounter
      description: |
        Rolls initiative for all participants and begins combat. Sets
        encounter status to active.
      tags: [Encounters]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: encounterId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Encounter started with initiative order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartEncounterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Combat Turns ──────────────────────────────────────────────────

  /combat/{sessionId}/status:
    get:
      operationId: getCombatStatus
      summary: Get combat status
      description: Returns the current state of the active encounter.
      tags: [Combat]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Combat state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombatStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /combat/{sessionId}/turn/attack:
    post:
      operationId: attack
      summary: Execute an attack
      description: |
        Rolls attack against a target, applies hit/miss logic, and
        updates HP. Must be the attacker's turn.
      tags: [Combat]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttackRequest"
      responses:
        "200":
          description: Attack result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AttackHitResponse"
                  - $ref: "#/components/schemas/AttackMissResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /combat/{sessionId}/turn/end:
    post:
      operationId: endTurn
      summary: End current turn
      description: |
        Ends the current participant's turn and advances to the next
        in initiative order. If all enemies or all characters are
        defeated, ends the encounter.
      tags: [Combat]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Turn ended, next participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnEndResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Enemies ───────────────────────────────────────────────────────

  /enemies:
    get:
      operationId: getAllEnemies
      summary: List enemies
      description: |
        Returns a paginated list of enemies, or all enemies for a specific tier
        when the `tier` query parameter (`1..5`) is provided.
      tags: [Enemies]
      parameters:
        - name: tier
          in: query
          description: Optional tier filter (1-5). Returns an array directly when set.
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 20
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated enemies or tier array
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Enemy"
                  - type: object
                    required: [data, pagination]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Enemy"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createEnemy
      summary: Create an enemy
      description: Creates a new enemy in the enemy pool. **Admin only**.
      tags: [Enemies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnemyRequest"
      responses:
        "201":
          description: Enemy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enemy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /enemies/{enemyId}:
    get:
      operationId: getEnemy
      summary: Get an enemy by ID
      tags: [Enemies]
      parameters:
        - name: enemyId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Enemy object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enemy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: updateEnemy
      summary: Update an enemy
      description: Updates an existing enemy. **Admin only**.
      tags: [Enemies]
      parameters:
        - name: enemyId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnemyRequest"
      responses:
        "200":
          description: Enemy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enemy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteEnemy
      summary: Delete an enemy
      description: Deletes an enemy by ID. **Admin only**.
      tags: [Enemies]
      parameters:
        - name: enemyId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Enemy deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Daily Runs & Leaderboard ──────────────────────────────────────

  /daily/{tier}:
    get:
      operationId: getDailyDungeon
      summary: Get today's daily dungeon and active runs
      description: |
        Returns today's deterministic dungeon DAG for the specified tier
        (`1..5`, with `10, 15, 20, 25, or 30` floors), along with the
        authenticated user's active (resumable) runs and scores for today.
      tags: [Daily Run]
      parameters:
        - name: tier
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        "200":
          description: Daily dungeon view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /daily/{tier}/leaderboard:
    get:
      operationId: getDailyLeaderboard
      summary: Get today's leaderboard for a tier
      description: Returns ranked daily scores for the specified tier (`1..5`).
      tags: [Daily Run]
      parameters:
        - name: tier
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 20
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated daily leaderboard
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DailyScore"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /daily/start:
    post:
      operationId: startOrResumeDailyRun
      summary: Start or resume today's daily run
      description: |
        Starts today's daily run for the chosen character (in the tier derived
        from its level), or seamlessly resumes an existing active run if the
        player paused or disconnected mid-run.
      tags: [Daily Run]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyStartRequest"
      responses:
        "200":
          description: Current state of the started or resumed run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Daily run for this character and tier is already completed today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /daily/move:
    post:
      operationId: moveDailyRun
      summary: Advance to the next room in the daily dungeon
      description: |
        Moves the character to one of the `next_node_ids` connected to the
        current cleared room. Resolves `rest` and `chest` rooms immediately,
        or initiates combat for `combat`, `elite`, `mini_boss`, and `boss` rooms.
      tags: [Daily Run]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyMoveRequest"
      responses:
        "200":
          description: Updated run state after entering the room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /daily/action:
    post:
      operationId: dailyCombatAction
      summary: Execute a turn in active daily run combat
      description: |
        Resolves one player turn (`attack`, `heavy_attack`, or `use_item`) and
        the enemy counter-attack if it survives. Persists character HP, enemy HP,
        loot drops, level ups on Boss victory, and leaderboard score automatically.
      tags: [Daily Run]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyActionRequest"
      responses:
        "200":
          description: Updated run state with detailed combat turn results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── System ────────────────────────────────────────────────────────

  /metrics:
    servers:
      - url: /
    get:
      security: []
      operationId: getMetrics
      summary: Prometheus metrics
      description: Exposes Prometheus metrics for monitoring
      tags: [System]
      responses:
        "200":
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT returned by `/auth/login`. Include as `Authorization: Bearer <token>`.
        Send on every authenticated request. The token embeds the user's role
        (`user` or `admin`); `admin` can modify/delete any character.
  schemas:

    # ─── Auth ────────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      description: Payload for creating a new user account.
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-zA-Z0-9_]+$"
          example: "player1"
        email:
          type: string
          format: email
          maxLength: 254
          example: "player1@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: "secret123"

    LoginRequest:
      type: object
      description: Payload for user authentication. Provide either `username` or `email` along with `password`.
      required: [password]
      properties:
        username:
          type: string
          example: "player1"
        email:
          type: string
          format: email
          example: "player1@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: "secret123"

    AuthResponse:
      type: object
      description: JWT token response. The token's `user_id` claim is the user's UUIDv7 (string) and `role` is `user` or `admin`.
      required: [token, expires_at]
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIs..."
        expires_at:
          type: string
          format: date-time
          example: "2025-01-02T00:00:00Z"

    UserResponse:
      type: object
      description: Public user profile (no password hash).
      required: [id, username, email, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Time-ordered UUIDv7 assigned to the user at registration.
          example: "0194f8c0-0000-7000-8000-000000000000"
        role:
          type: string
          enum: [user, admin]
          example: "user"
        username:
          type: string
          example: "player1"
        email:
          type: string
          format: email
          example: "player1@example.com"
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00Z"

    # ─── Stats ───────────────────────────────────────────────────────

    Stats:
      type: object
      description: Character base statistics (each 1-99).
      required: [strength, dexterity, constitution, intelligence, wisdom, charisma]
      properties:
        strength:
          type: integer
          minimum: 1
          maximum: 99
          example: 10
        dexterity:
          type: integer
          minimum: 1
          maximum: 99
          example: 5
        constitution:
          type: integer
          minimum: 1
          maximum: 99
          example: 10
        intelligence:
          type: integer
          minimum: 1
          maximum: 99
          example: 5
        wisdom:
          type: integer
          minimum: 1
          maximum: 99
          example: 7
        charisma:
          type: integer
          minimum: 1
          maximum: 99
          example: 3

    # ─── Customization ───────────────────────────────────────────────

    Customization:
      type: object
      description: Ashen-inspired character appearance customization fields (silhouette and palette indices, no facial features).
      required: [hair, beard, skin_tone, hair_color, cloak, accent_color]
      properties:
        hair:
          type: integer
          minimum: 0
          maximum: 20
          example: 4
        beard:
          type: integer
          minimum: 0
          maximum: 15
          example: 2
        skin_tone:
          type: integer
          minimum: 0
          maximum: 15
          example: 3
        hair_color:
          type: integer
          minimum: 0
          maximum: 15
          example: 7
        cloak:
          type: integer
          minimum: 0
          maximum: 15
          example: 1
        accent_color:
          type: integer
          minimum: 0
          maximum: 15
          example: 5

    # ─── Character ───────────────────────────────────────────────────

    Character:
      type: object
      description: A full character object with stats, customization, and RPG fields.
      required:
        [id, name, body_type, species, class, level, xp, hp_max, hp_current,
         stats, customization]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          minLength: 1
          example: "Arwen"
        body_type:
          type: string
          enum: [type_a, type_b]
          example: "type_b"
        species:
          type: string
          enum:
            [aasimar, dragonborn, dwarf, elf, gnome, goliath, halfling,
             human, orc, tiefling]
          example: "elf"
        class:
          type: string
          enum:
            [barbarian, bard, cleric, druid, fighter, monk, paladin,
             ranger, rogue, sorcerer, warlock, wizard]
          example: "wizard"
        level:
          type: integer
          minimum: 1
          example: 3
        xp:
          type: integer
          minimum: 0
          example: 1200
        hp_max:
          type: integer
          minimum: 1
          example: 28
        hp_current:
          type: integer
          minimum: 0
          example: 20
        prestige:
          type: integer
          minimum: 0
          example: 0
        stats:
          $ref: "#/components/schemas/Stats"
        customization:
          $ref: "#/components/schemas/Customization"

    CreateCharacterRequest:
      type: object
      description: Payload for creating or updating a character (no id).
      required: [name, body_type, species, class, stats, customization]
      properties:
        name:
          type: string
          minLength: 1
          example: "Arwen"
        body_type:
          type: string
          enum: [type_a, type_b]
          example: "type_b"
        species:
          type: string
          enum:
            [aasimar, dragonborn, dwarf, elf, gnome, goliath, halfling,
             human, orc, tiefling]
          example: "elf"
        class:
          type: string
          enum:
            [barbarian, bard, cleric, druid, fighter, monk, paladin,
             ranger, rogue, sorcerer, warlock, wizard]
          example: "wizard"
        stats:
          $ref: "#/components/schemas/Stats"
        customization:
          $ref: "#/components/schemas/Customization"

    EquipRequest:
      type: object
      description: Payload for equipping or unequipping an item.
      required: [equip]
      properties:
        equip:
          type: boolean
          description: true to equip, false to unequip
          example: true

    EquipResponse:
      type: object
      description: Character state after equipping/unequipping.
      properties:
        id:
          type: integer
        name:
          type: string
        ac:
          type: integer
          example: 15
        hp_current:
          type: integer
        hp_max:
          type: integer
        level:
          type: integer
        xp:
          type: integer
        equipped_items:
          type: array
          items:
            type: integer
          example: [1, 4]

    # ─── Item ────────────────────────────────────────────────────────

    Item:
      type: object
      description: An item from the item pool.
      required: [id, name, type, description, equippable, rarity]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          minLength: 3
          maxLength: 50
          example: "Master Sword"
        type:
          type: string
          enum:
            [armor, ring, weapon, shield, tool, adventuring_gear, rod,
             staff, wand, scroll, potion, ammo, consumable, wondrous_item]
          example: "weapon"
        description:
          type: string
          minLength: 3
          maxLength: 300
          example: "A legendary sword with immense power."
        equippable:
          type: boolean
          example: true
        rarity:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        damage:
          type: integer
          minimum: 0
          example: 34
        defense:
          type: integer
          minimum: 0
          example: 23
        heal_amount:
          type: integer
          minimum: 0
          example: 10
        mana_cost:
          type: integer
          minimum: 0
          example: 4
        duration:
          type: integer
          minimum: 0
          example: 233
        cooldown:
          type: integer
          minimum: 0
          example: 120
        capacity:
          type: integer
          minimum: 0
          example: 3

    CreateItemRequest:
      type: object
      description: Payload for creating an item (no id).
      required: [name, type, description, equippable, rarity]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          example: "Master Sword"
        type:
          type: string
          enum:
            [armor, ring, weapon, shield, tool, adventuring_gear, rod,
             staff, wand, scroll, potion, ammo, consumable, wondrous_item]
          example: "weapon"
        description:
          type: string
          minLength: 3
          maxLength: 300
          example: "A legendary sword with immense power."
        equippable:
          type: boolean
          example: true
        rarity:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        damage:
          type: integer
          minimum: 0
          example: 34
        defense:
          type: integer
          minimum: 0
          example: 23
        heal_amount:
          type: integer
          minimum: 0
          example: 10
        mana_cost:
          type: integer
          minimum: 0
          example: 4
        duration:
          type: integer
          minimum: 0
          example: 233
        cooldown:
          type: integer
          minimum: 0
          example: 120
        capacity:
          type: integer
          minimum: 0
          example: 3

    InventoryItem:
      type: object
      description: An item entry in a character's inventory.
      required: [items, quantity, is_equipped]
      properties:
        items:
          $ref: "#/components/schemas/Item"
        quantity:
          type: integer
          minimum: 1
          example: 3
        is_equipped:
          type: boolean
          example: false

    # ─── Dice Rolling ────────────────────────────────────────────────

    RollRequest:
      type: object
      description: Payload for a dice roll.
      required: [dice, count]
      properties:
        dice:
          type: string
          enum: [d4, d6, d8, d10, d12, d20, d100]
          example: "d20"
        count:
          type: integer
          minimum: 1
          maximum: 100
          example: 1
        modifier:
          type: integer
          minimum: -100
          maximum: 100
          example: 5

    RollResponse:
      type: object
      description: Result of a dice roll.
      required: [rolls, total, dice, count]
      properties:
        rolls:
          type: array
          items:
            type: integer
          example: [17]
        total:
          type: integer
          example: 22
        modifier:
          type: integer
          example: 5
        dice:
          type: string
          example: "d20"
        count:
          type: integer
          example: 1

    # ─── Sessions ────────────────────────────────────────────────────

    CreateSessionRequest:
      type: object
      description: Payload for creating or updating a game session.
      required: [name, character_ids]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "The Lost Mine of Phandelver"
        character_ids:
          type: array
          items:
            type: integer
          example: [1, 2, 3]

    Session:
      type: object
      description: A game session with its participants.
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "The Lost Mine of Phandelver"
        user_id:
          type: integer
          example: 1
        status:
          type: string
          enum: [idle, encounter_active, completed]
          example: "idle"
        characters:
          type: array
          items:
            $ref: "#/components/schemas/SessionCharacter"
        current_encounter_id:
          type: integer
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time

    SessionCharacter:
      type: object
      description: A character summary within a session.
      properties:
        id:
          type: integer
        name:
          type: string
        class:
          type: string
        level:
          type: integer
        hp_current:
          type: integer
        hp_max:
          type: integer

    SessionListItem:
      type: object
      description: A session summary for list views.
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        character_count:
          type: integer
        created_at:
          type: string
          format: date-time

    # ─── Encounters ──────────────────────────────────────────────────

    CreateEncounterRequest:
      type: object
      description: Payload for creating an encounter with enemies.
      required: [name, enemies]
      properties:
        name:
          type: string
          example: "Goblin Ambush"
        enemies:
          type: array
          items:
            $ref: "#/components/schemas/EnemyTemplate"

    EnemyTemplate:
      type: object
      description: Template for an enemy participant.
      required:
        [name, class, level, hp_max, hp_current, ac, stats]
      properties:
        name:
          type: string
          example: "Goblin A"
        class:
          type: string
          example: "goblin"
        level:
          type: integer
          example: 1
        hp_max:
          type: integer
          example: 7
        hp_current:
          type: integer
          example: 7
        ac:
          type: integer
          example: 15
        stats:
          $ref: "#/components/schemas/Stats"

    Encounter:
      type: object
      description: A combat encounter with participants.
      properties:
        id:
          type: integer
        session_id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [pending, active, victory, defeat]
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"

    EncounterSummary:
      type: object
      description: A lightweight encounter summary.
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        participant_count:
          type: integer

    Participant:
      type: object
      description: A participant in an encounter (character or enemy).
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [character, enemy]
        name:
          type: string
        initiative:
          type: integer
          nullable: true
        hp_current:
          type: integer
        hp_max:
          type: integer
        ac:
          type: integer
        status_effects:
          type: array
          items:
            type: string

    StartEncounterResponse:
      type: object
      description: Result of starting an encounter (initiative order).
      properties:
        encounter_id:
          type: integer
        status:
          type: string
          enum: [active]
        turn_order:
          type: array
          items:
            type: object
            properties:
              participant_id:
                type: integer
              name:
                type: string
              initiative:
                type: integer
              type:
                type: string
                enum: [character, enemy]
        current_turn:
          type: integer
        current_participant_id:
          type: integer

    # ─── Combat ──────────────────────────────────────────────────────

    CombatStatusResponse:
      type: object
      description: Full state of an active combat encounter.
      properties:
        session_id:
          type: integer
        encounter_id:
          type: integer
        status:
          type: string
          enum: [active, victory, defeat]
        turn:
          type: integer
        current_participant:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            type:
              type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/CombatParticipant"

    CombatParticipant:
      type: object
      description: A participant in combat with current state.
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [character, enemy]
        hp_current:
          type: integer
        hp_max:
          type: integer
        ac:
          type: integer
        status_effects:
          type: array
          items:
            type: string

    AttackRequest:
      type: object
      description: Payload for an attack action.
      required: [attacker_id, target_id, ability]
      properties:
        attacker_id:
          type: integer
          description: Participant ID of the attacker
        target_id:
          type: integer
          description: Participant ID of the target
        ability:
          type: string
          enum:
            [strength, dexterity, constitution, intelligence, wisdom, charisma]
          example: "strength"
        weapon_item_id:
          type: integer
          description: Optional equipped weapon item ID for damage

    AttackHitResponse:
      type: object
      description: Result of a successful attack.
      properties:
        attack_roll:
          type: integer
        attack_total:
          type: integer
        is_hit:
          type: boolean
          enum: [true]
        damage_roll:
          type: integer
        damage_total:
          type: integer
        target_id:
          type: integer
        target_hp_before:
          type: integer
        target_hp_after:
          type: integer
        target_defeated:
          type: boolean

    AttackMissResponse:
      type: object
      description: Result of a missed attack.
      properties:
        attack_roll:
          type: integer
        attack_total:
          type: integer
        is_hit:
          type: boolean
          enum: [false]
        target_id:
          type: integer
        target_ac:
          type: integer

    TurnEndResponse:
      type: object
      description: Result of ending a turn.
      properties:
        previous_participant_id:
          type: integer
        current_participant_id:
          type: integer
        current_participant_name:
          type: string
        current_participant_type:
          type: string
        turn_number:
          type: integer
        status:
          type: string
          enum: [active, victory, defeat]
        xp_reward:
          type: integer

    # ─── Enemies & Daily Run ─────────────────────────────────────────

    Enemy:
      type: object
      required: [id, name, type, tier, description, hp_max, ac, damage, xp_reward, score_reward]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Goblin Scout"
        type:
          type: string
          enum: [normal, elite, mini_boss, boss]
          example: "normal"
        tier:
          type: integer
          minimum: 1
          maximum: 5
          example: 1
        description:
          type: string
          example: "A nimble goblin armed with a jagged rusty dagger."
        hp_max:
          type: integer
          minimum: 1
          maximum: 1000
          example: 18
        ac:
          type: integer
          minimum: 5
          maximum: 30
          example: 11
        damage:
          type: integer
          minimum: 1
          example: 4
        xp_reward:
          type: integer
          minimum: 1
          example: 25
        score_reward:
          type: integer
          minimum: 1
          example: 50

    CreateEnemyRequest:
      type: object
      required: [name, type, tier, description, hp_max, ac, damage, xp_reward, score_reward]
      properties:
        name:
          type: string
          example: "Goblin Scout"
        type:
          type: string
          enum: [normal, elite, mini_boss, boss]
        tier:
          type: integer
          minimum: 1
          maximum: 5
        description:
          type: string
        hp_max:
          type: integer
          minimum: 1
          maximum: 1000
        ac:
          type: integer
          minimum: 5
          maximum: 30
        damage:
          type: integer
          minimum: 1
        xp_reward:
          type: integer
          minimum: 1
        score_reward:
          type: integer
          minimum: 1

    GraphNode:
      type: object
      required: [id, floor, type, next_node_ids]
      properties:
        id:
          type: string
          example: "f2_n1"
        floor:
          type: integer
          example: 2
        type:
          type: string
          enum: [combat, elite, mini_boss, chest, rest, boss]
        next_node_ids:
          type: array
          items:
            type: string
        check_stat:
          type: string
          example: "dexterity"
        check_dc:
          type: integer
          example: 13

    DungeonGraph:
      type: object
      required: [run_date, tier, total_floors, start_node_id, nodes]
      properties:
        run_date:
          type: string
          format: date
          example: "2026-11-21"
        tier:
          type: integer
          minimum: 1
          maximum: 5
        total_floors:
          type: integer
          enum: [10, 15, 20, 25, 30]
        start_node_id:
          type: string
          example: "f1_n1"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"

    DailyRun:
      type: object
      properties:
        id:
          type: integer
        run_date:
          type: string
          format: date-time
        tier:
          type: integer
        user_id:
          type: string
          format: uuid
        character_id:
          type: integer
        total_floors:
          type: integer
        current_floor:
          type: integer
        current_node_id:
          type: string
        visited_nodes:
          type: array
          items:
            type: string
        turns_taken:
          type: integer
        score:
          type: integer
        status:
          type: string
          enum: [in_progress, in_combat, victory, defeat]
        current_enemy_id:
          type: integer
          nullable: true
        current_enemy_hp:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DailyScore:
      type: object
      properties:
        id:
          type: integer
        run_date:
          type: string
          format: date-time
        tier:
          type: integer
        user_id:
          type: string
          format: uuid
        username:
          type: string
        character_id:
          type: integer
        character_name:
          type: string
        character_class:
          type: string
        character_level:
          type: integer
        character_prestige:
          type: integer
        score:
          type: integer
        floors_cleared:
          type: integer
        total_floors:
          type: integer
        turns_taken:
          type: integer
        hp_remaining:
          type: integer
        completed:
          type: boolean
        created_at:
          type: string
          format: date-time

    DailyView:
      type: object
      properties:
        dungeon:
          $ref: "#/components/schemas/DungeonGraph"
        active_runs:
          type: array
          items:
            $ref: "#/components/schemas/DailyRun"
        user_scores:
          type: array
          items:
            $ref: "#/components/schemas/DailyScore"

    DailyStartRequest:
      type: object
      required: [character_id]
      properties:
        character_id:
          type: integer
          minimum: 1

    DailyMoveRequest:
      type: object
      required: [character_id, node_id]
      properties:
        character_id:
          type: integer
          minimum: 1
        node_id:
          type: string
          example: "f2_n1"

    DailyActionRequest:
      type: object
      required: [character_id, action]
      properties:
        character_id:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [attack, heavy_attack, use_item]
        item_id:
          type: integer
          description: Required when action is `use_item`

    SkillCheckResult:
      type: object
      properties:
        stat:
          type: string
        dc:
          type: integer
        roll:
          type: integer
        modifier:
          type: integer
        total:
          type: integer
        success:
          type: boolean

    CombatTurnResult:
      type: object
      properties:
        action:
          type: string
          enum: [attack, heavy_attack, use_item]
        player_attack_roll:
          type: integer
        player_attack_total:
          type: integer
        player_hit:
          type: boolean
        player_critical:
          type: boolean
        player_damage:
          type: integer
        healed_hp:
          type: integer
        enemy_defeated:
          type: boolean
        enemy_attack_roll:
          type: integer
        enemy_attack_total:
          type: integer
        enemy_hit:
          type: boolean
        enemy_damage:
          type: integer
        player_defeated:
          type: boolean

    RunStateResponse:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/DailyRun"
        character:
          $ref: "#/components/schemas/Character"
        current_node:
          $ref: "#/components/schemas/GraphNode"
        current_enemy:
          $ref: "#/components/schemas/Enemy"
        next_node_ids:
          type: array
          items:
            type: string
        event_log:
          type: array
          items:
            type: string
        loot_item:
          $ref: "#/components/schemas/Item"
        check_roll:
          $ref: "#/components/schemas/SkillCheckResult"
        turn_result:
          $ref: "#/components/schemas/CombatTurnResult"
        final_score:
          $ref: "#/components/schemas/DailyScore"

    # ─── Common ──────────────────────────────────────────────────────

    DeleteResponse:
      type: object
      description: Generic success response for deletion.
      required: [result]
      properties:
        result:
          type: string
          example: "success"

    Pagination:
      type: object
      description: Pagination metadata.
      required: [page, limit, total, has_next]
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        has_next:
          type: boolean
          example: true

    ApiError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          example: "Invalid ID"
        code:
          type: string
          example: "BAD_REQUEST"
        details:
          type: object
          description: Additional error context (may vary per error)
          example: { "id": "abc" }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Not the character owner (and not an admin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        text/plain:
          schema:
            type: string
            example: "429 too many requests"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
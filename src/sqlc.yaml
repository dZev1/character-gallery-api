version: "2"
sql:
  - engine: "postgresql"
    queries: "database/queries"
    schema: "database/schema"
    gen:
      go:
        package: "db"
        out: "internal/postgres/db"
        sql_package: "pgx/v5"
        emit_result_struct_pointers: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

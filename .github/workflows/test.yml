name: Test Project

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26.4

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Vet
        working-directory: ./src
        run: go vet ./...

      - name: Vulnerability scan
        working-directory: ./src
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Run Go tests
        working-directory: ./src
        env:
          POSTGRES_TEST_DATABASE_URL: postgres://testuser:testpassword@postgres:5432/tests?sslmode=disable
          REDIS_TEST_URL: redis://redis:6379/0
        run: go test -race -v ./...
